name: CI

# Self-hosted runner trust boundary (PUBLIC repository):
# - runs only on push to main and manual workflow_dispatch (owner-authorized)
# - external fork PRs NEVER execute on the self-hosted runner:
#   there is deliberately no `pull_request` trigger in this workflow
# - minimal token scope: contents: read
# - checkout persists no credentials on the persistent runner host

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: [self-hosted, Linux, X64, orcana-ci]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

  core:
    runs-on: [self-hosted, Linux, X64, orcana-ci]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Core runtime and replay gates
        run: bun run test:core

  test:
    runs-on: [self-hosted, Linux, X64, orcana-ci]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full test suite
        run: bun run test

  eval-linux:
    runs-on: [self-hosted, Linux, X64, orcana-ci]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Linux sandbox eval (real delegated cgroup required)
        run: bash scripts/ci/run-delegated-cgroup.sh bun run eval:linux --require=cgroup

  build:
    runs-on: [self-hosted, Linux, X64, orcana-ci]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
