name: Linux Sandbox Lanes

# R6: 真实验收 —— 真实 Bubblewrap / 真实 Rootless Podman / 真实 cgroup。
# 审计要求：关键场景不允许 Skip 后仍宣布 Freeze。这些 lane 在真实后端
# 存在时自动把条件测试转为真执行；缺失时该 lane 自身失败（而不是测试
# 静默跳过）—— 能力校验不过即红，杜绝"假 Freeze"。
#
# Self-hosted trust boundary (PUBLIC repository):
# - runs only on push to main and manual workflow_dispatch (owner-authorized)
# - external fork PRs NEVER execute on the self-hosted runner (no pull_request
#   trigger) — Linux sandbox tests are kernel/container-level and therefore the
#   most sensitive lanes; they must never accept untrusted PR content.
# - no `sudo` is used on the self-hosted host: capabilities are verified, not
#   installed. Missing capability fails the lane (fail closed).
# - minimal token scope: contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-lanes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane-bubblewrap:
    runs-on: [self-hosted, Linux, X64, orcana-ci]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify real Bubblewrap capability (fail closed)
        run: |
          command -v bwrap || { echo "::error::bubblewrap is not installed on the self-hosted host"; exit 78; }
          bwrap --version
          bwrap --unshare-all --bind / / sh -c 'echo real-bwrap-ok'
      - run: bun install --frozen-lockfile
      - name: Real bubblewrap backend tests (conditionals auto-enable)
        run: bun test tests/runtime/linux/bubblewrap.test.ts tests/runtime/linux/linux-foundation.test.ts
      - name: Linux sandbox eval with real bwrap
        run: bun run eval:linux --require=bubblewrap

  lane-podman:
    runs-on: [self-hosted, Linux, X64, orcana-ci]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify real rootless Podman capability (fail closed)
        run: |
          command -v podman || { echo "::error::podman is not installed on the self-hosted host"; exit 78; }
          podman --version
          podman info --format '{{.Host.Security.Rootless}}' | grep -q 'true' || { echo "::error::podman is not running rootless"; exit 78; }
          podman pull -q docker.io/library/alpine:latest
          DIGEST=$(podman image inspect --format '{{.Digest}}' docker.io/library/alpine:latest)
          echo "resolved digest: $DIGEST"
          podman run --rm --network=none --read-only --cap-drop=ALL "docker.io/library/alpine@$DIGEST" echo real-podman-ok
      - run: bun install --frozen-lockfile
      - name: Real podman backend tests (digest-locked image, strict no-degrade)
        run: bun test tests/runtime/linux/podman.test.ts
      - name: Linux sandbox eval (LX-030 real)
        run: bun run eval:linux --require=podman
      - name: Cleanup Orcana Podman resources and pause process
        if: always()
        timeout-minutes: 3
        run: |
          ids="$(timeout 45s podman ps -a -q --filter label=io.orcana.run || true)"
          if [ -n "$ids" ]; then timeout 60s podman rm -f $ids; fi
          timeout 60s podman system migrate
          # Scope to the runner's own uid: on shared/self-hosted hosts other
          # users' podman sessions may legitimately hold catatonit processes.
          test -z "$(pgrep -u "$(id -u)" -x catatonit || true)"

  lane-cgroup:
    runs-on: [self-hosted, Linux, X64, orcana-ci]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Host cgroup diagnostics
        run: |
          mount | grep cgroup2 || true
          ls -la /sys/fs/cgroup/ | head -20
          cat /proc/self/cgroup
      - run: bun install --frozen-lockfile
      - name: Real delegated cgroup tests and resource eval
        run: bash scripts/ci/run-delegated-cgroup.sh bun run ci:cgroup
